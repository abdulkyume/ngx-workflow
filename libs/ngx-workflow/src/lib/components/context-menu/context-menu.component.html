@if (state().isOpen) {
  <div class="ngx-workflow-context-menu" [style.left.px]="state().position.x"
    [style.top.px]="state().position.y">
    @for (item of state().items; track item.label) {
      <div class="ngx-workflow-context-menu-item" [class.disabled]="item.disabled"
        [class.danger]="item.danger" (click)="!item.disabled && onActionClick($event, item.action)">
        <span class="label">{{ item.label }}</span>
        @if (item.shortcut) {
          <span class="shortcut">{{ item.shortcut }}</span>
        }
      </div>
    }
  </div>
}
