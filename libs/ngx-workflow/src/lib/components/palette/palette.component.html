<div class="ngx-workflow-palette" [class.horizontal]="orientation === 'horizontal'">
  <div class="ngx-workflow-palette__header" *ngIf="title">
    <span class="ngx-workflow-palette__title">{{ title }}</span>
  </div>

  <div class="ngx-workflow-palette__items">
    <div
      *ngFor="let item of items"
      class="ngx-workflow-palette__item"
      draggable="true"
      (dragstart)="onDragStart($event, item)"
    >
      <div class="ngx-workflow-palette__item-icon" *ngIf="item.icon">
        {{ item.icon }}
      </div>
      <div class="ngx-workflow-palette__item-content">
        <div class="ngx-workflow-palette__item-label">{{ item.label }}</div>
        <div class="ngx-workflow-palette__item-desc" *ngIf="item.description">
          {{ item.description }}
        </div>
      </div>
    </div>
  </div>
</div>
